<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="vsFullBg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0f1325" />
      <stop offset="60%" stop-color="#070913" />
      <stop offset="100%" stop-color="#04050a" />
    </radialGradient>
    
    <!-- Brain Cyan-Blue Gradient -->
    <linearGradient id="vsBrainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="60%" stop-color="#00a6ff" />
      <stop offset="100%" stop-color="#0062ff" />
    </linearGradient>

    <!-- Bulb Golden-Amber Gradient -->
    <linearGradient id="vsBulbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe600" />
      <stop offset="50%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff3300" />
    </linearGradient>

    <!-- Bridge Rainbow Gradient -->
    <linearGradient id="vsBridgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="25%" stop-color="#00ff88" />
      <stop offset="50%" stop-color="#ffea00" />
      <stop offset="75%" stop-color="#ff7700" />
      <stop offset="100%" stop-color="#ff0055" />
    </linearGradient>

    <!-- Setu Text Gradient -->
    <linearGradient id="vsSetuGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="50%" stop-color="#fb8500" />
      <stop offset="100%" stop-color="#ff006e" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="vsCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#00f2fe" flood-opacity="0.5" />
    </filter>
    <filter id="vsAmberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffaa00" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Dark Canvas Base -->
  <rect width="800" height="800" rx="36" fill="url(#vsFullBg)" />

  <!-- MAIN EMBLEM GROUP (Brain + Bulb + Bridge + Book) -->
  <g transform="translate(400, 260) scale(1.05)">
    <!-- LEFT BRAIN HEMISPHERE -->
    <g transform="translate(-16, -140)" filter="url(#vsCyanGlow)">
      <!-- Outer contoured brain lobes -->
      <path d="M-10 0 C-45 -8, -80 12, -80 48 C-108 48, -130 75, -122 108 C-152 118, -165 155, -150 190 C-165 220, -145 262, -115 275 C-95 310, -55 318, -10 318 Z" 
            fill="none" stroke="url(#vsBrainGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Inner Synaptic Circuit Traces -->
      <path d="M-10 58 C-60 58, -50 115, -25 135" fill="none" stroke="url(#vsBrainGrad)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-25" cy="135" r="9" fill="#00f2fe" />

      <path d="M-10 160 C-90 160, -70 210, -45 235" fill="none" stroke="url(#vsBrainGrad)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-45" cy="235" r="9" fill="#00f2fe" />

      <path d="M-10 245 C-60 245, -45 285, -15 292" fill="none" stroke="url(#vsBrainGrad)" stroke-width="11" stroke-linecap="round"/>
      <circle cx="-15" cy="292" r="9" fill="#00f2fe" />

      <!-- Synaptic Circuit Nodes -->
      <circle cx="-75" cy="100" r="10" fill="#00f2fe" />
      <circle cx="-100" cy="190" r="10" fill="#00f2fe" />
      <line x1="-75" y1="100" x2="-100" y2="190" stroke="url(#vsBrainGrad)" stroke-width="7" stroke-dasharray="2 4" />
    </g>

    <!-- RIGHT LIGHTBULB & HUMAN OF WISDOM -->
    <g transform="translate(16, -140)" filter="url(#vsAmberGlow)">
      <!-- Outer Bulb Outline -->
      <path d="M10 0 C75 -8, 130 48, 130 118 C130 165, 105 205, 85 240 C70 268, 68 295, 10 310" 
            fill="none" stroke="url(#vsBulbGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Radiant Enlightenment Rays -->
      <line x1="45" y1="50" x2="65" y2="30" stroke="#ffea00" stroke-width="9" stroke-linecap="round" />
      <line x1="88" y1="92" x2="114" y2="84" stroke="#ffaa00" stroke-width="9" stroke-linecap="round" />
      <line x1="90" y1="150" x2="115" y2="160" stroke="#ff7700" stroke-width="9" stroke-linecap="round" />

      <!-- Empowered Human Figure Inside -->
      <!-- Head -->
      <circle cx="48" cy="98" r="20" fill="#ffea00" />
      <!-- Torso / Spine -->
      <path d="M48 132 C26 195, 18 250, 20 305" fill="none" stroke="#ffaa00" stroke-width="13" stroke-linecap="round" />
      <!-- Reaching Arm of Aspiration -->
      <path d="M22 178 C35 145, 82 110, 95 116" fill="none" stroke="#ffe600" stroke-width="12" stroke-linecap="round" />
    </g>

    <!-- ARCHED RAINBOW BRIDGE OVER OPEN BOOK -->
    <g transform="translate(0, 140)">
      <!-- Upper Bridge Arch (Rainbow) -->
      <path d="M-175 42 Q 0 -58 175 42" fill="none" stroke="url(#vsBridgeGrad)" stroke-width="22" stroke-linecap="round"/>
      <!-- Bridge Roadway / Deck -->
      <path d="M-175 42 Q 0 -32 175 42" fill="none" stroke="#070a14" stroke-width="12" stroke-linecap="round"/>

      <!-- Vertical Suspension Cables -->
      <line x1="-110" y1="28" x2="-110" y2="0" stroke="url(#vsBridgeGrad)" stroke-width="6" />
      <line x1="-55" y1="10" x2="-55" y2="-22" stroke="url(#vsBridgeGrad)" stroke-width="6" />
      <line x1="0" y1="4" x2="0" y2="-32" stroke="url(#vsBridgeGrad)" stroke-width="7" />
      <line x1="55" y1="10" x2="55" y2="-22" stroke="url(#vsBridgeGrad)" stroke-width="6" />
      <line x1="110" y1="28" x2="110" y2="0" stroke="url(#vsBridgeGrad)" stroke-width="6" />

      <!-- Left Post / Tower -->
      <rect x="-142" y="-12" width="22" height="74" rx="6" fill="#00e5ff" />
      <circle cx="-131" cy="-18" r="12" fill="#00ffcc" />

      <!-- Right Post / Tower -->
      <rect x="120" y="-12" width="22" height="74" rx="6" fill="#ff7700" />
      <circle cx="131" cy="-18" r="12" fill="#ffcc00" />
    </g>

    <!-- THE OPEN BOOK OF KNOWLEDGE -->
    <g transform="translate(0, 150)">
      <!-- Deep Blue Foundation Pages -->
      <path d="M-185 88 Q 0 15 0 88 Q 0 15 185 88 L 170 115 Q 0 45 0 115 Q 0 45 -170 115 Z" fill="#0044cc" />
      
      <!-- Luminous White Open Pages -->
      <path d="M-195 62 Q 0 -18 0 62 Q 0 -18 195 62 L 182 88 Q 0 15 0 88 Q 0 15 -182 88 Z" fill="#ffffff" />

      <!-- Fanned Page Grooves -->
      <path d="M-140 62 Q 0 3 0 68 Q 0 3 140 62" fill="none" stroke="#003399" stroke-width="4" />
      <path d="M-125 75 Q 0 18 0 80 Q 0 18 125 75" fill="none" stroke="#0055ff" stroke-width="4" />
    </g>
  </g>

  <!-- OFFICIAL BRAND TYPOGRAPHY: VIDYA SETU -->
  <g transform="translate(400, 595)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
          font-weight="900" font-size="76" letter-spacing="4">
      <tspan x="-125" fill="#FFFFFF">VIDYA</tspan>
      <tspan x="135" fill="url(#vsSetuGrad)">SETU</tspan>
    </text>
  </g>

  <!-- OFFICIAL TAGLINE: — SOCH SE SAMAJH TAK — -->
  <g transform="translate(400, 665)">
    <!-- Cyan Left Accent Line -->
    <line x1="-280" y1="-5" x2="-210" y2="-5" stroke="#00d2ff" stroke-width="4.5" stroke-linecap="round" />

    <!-- Tagline Text -->
    <text x="0" y="0" text-anchor="middle"
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="22" 
          font-weight="700" 
          letter-spacing="9">
      SOCH SE SAMAJH TAK
    </text>

    <!-- Magenta Right Accent Line -->
    <line x1="210" y1="-5" x2="280" y2="-5" stroke="#ff006e" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
