      </g>
      <!-- Right Tower -->
      <g transform="translate(150, 0)">
        <polygon points="-28,30 -20,-75 -15,-75 -15,30" />
        <polygon points="15,30 15,-75 20,-75 28,30" />
        <rect x="-16" y="-62" width="32" height="6" />
        <rect x="-18" y="-35" width="36" height="7" />
        <rect x="-22" y="-5" width="44" height="8" />
        <path d="M-15,30 L-15,0 Q0,-15 15,0 L15,30 Z" fill="#FFFFFF" />
      </g>
      <!-- Cables -->
      <path d="M-230,22 Q-190,0 -168,-72" fill="none" stroke="#0A2540" stroke-width="5" />
      <path d="M-132,-72 Q0,2 132,-72" fill="none" stroke="#0A2540" stroke-width="5" />
      <path d="M168,-72 Q190,0 230,22" fill="none" stroke="#0A2540" stroke-width="5" />
      <!-- Beam -->
      <rect x="-235" y="18" width="470" height="9" rx="2" fill="#0A2540" stroke="none" />
    </g>

    <!-- Open Book -->
    <g transform="translate(0, 52)">
      <path d="M-195,24 Q-95,-22 0,22 Q95,-22 195,24 L180,36 Q90,-8 0,33 Q-90,-8 -180,36 Z" fill="#0A2540" />
      <path d="M-190,14 Q-95,-25 0,16 Q95,-25 190,14 L178,25 Q90,-12 0,24 Q-90,-12 -178,25 Z" fill="#0284c7" />
      <path d="M-180,4 Q-90,-32 0,8 Q90,-32 180,4 L170,16 Q90,-18 0,18 Q-90,-18 -170,16 Z" fill="#0369a1" />
      <path d="M-155,-5 Q-80,-35 0,0 Q80,-35 155,-5 L145,5 Q75,-24 0,7 Q-75,-24 -145,5 Z" fill="#38bdf8" />
