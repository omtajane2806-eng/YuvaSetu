      <path d="M-44,11 C-44,28 0,38 44,11 L44,22 C44,39 0,50 -44,22 Z" fill="#071a2e" />
      <ellipse cx="0" cy="-6" rx="4" ry="2.5" fill="#071a2e" />
      <path d="M0,-6 Q32,-4 52,12 Q53,24 53,42" fill="none" stroke="#F25C05" stroke-width="5" stroke-linecap="round" />
      <circle cx="53" cy="22" r="5" fill="#F25C05" />
      <path d="M48,26 L58,26 L60,54 L46,54 Z" fill="#F25C05" />
