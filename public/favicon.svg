<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="favBgYuva" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background rounded squircle for favicon -->
  <rect width="512" height="512" rx="112" fill="url(#favBgYuva)" />
  <circle cx="256" cy="256" r="236" fill="#FFFFFF" opacity="0.96" />

  <!-- Centered Emblem -->
  <g transform="translate(256, 252) scale(0.92)">
    <!-- Sunburst Rays -->
    <g stroke="#F25C05" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="-175" x2="0" y2="-140" />
      <line x1="-50" y1="-165" x2="-35" y2="-132" />
      <line x1="50" y1="-165" x2="35" y2="-132" />
      <line x1="-95" y1="-138" x2="-68" y2="-112" />
      <line x1="95" y1="-138" x2="68" y2="-112" />
      <line x1="-125" y1="-95" x2="-92" y2="-82" />
      <line x1="125" y1="-95" x2="92" y2="-82" />
      <line x1="-135" y1="-45" x2="-102" y2="-45" />
      <line x1="135" y1="-45" x2="102" y2="-45" />
    </g>

    <!-- Suspension Bridge -->
    <g fill="#0A2540" stroke="#0A2540">
      <!-- Left Tower -->
      <g transform="translate(-150, 0)">
        <polygon points="-28,30 -20,-75 -15,-75 -15,30" />
        <polygon points="15,30 15,-75 20,-75 28,30" />
        <rect x="-16" y="-62" width="32" height="6" />
        <rect x="-18" y="-35" width="36" height="7" />
        <rect x="-22" y="-5" width="44" height="8" />
