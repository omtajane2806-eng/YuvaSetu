<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" fill="none">
  <defs>
    <!-- Royal Blue Pages Gradient -->
    <linearGradient id="ysPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0077d6" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Orange Pathway Gradient -->
    <linearGradient id="ysOrangeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Sunburst Glow -->
    <filter id="ysGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#f97316" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Badge Base (like in WhatsApp Image) -->
  <circle cx="300" cy="300" r="285" fill="#FFFFFF" stroke="#F1F5F9" stroke-width="4"/>

  <!-- EMBLEM GROUP (Centered in upper portion) -->
  <g transform="translate(300, 245)">
    <!-- 1. SUNBURST RAYS (Orange #F25C05) -->
    <g stroke="#F25C05" stroke-width="9" stroke-linecap="round">
      <!-- Top Center Ray -->
      <line x1="0" y1="-175" x2="0" y2="-140" />
      <!-- Upper Diagonals -->
      <line x1="-50" y1="-165" x2="-35" y2="-132" />
      <line x1="50" y1="-165" x2="35" y2="-132" />
      <!-- Middle Diagonals -->
      <line x1="-95" y1="-138" x2="-68" y2="-112" />
      <line x1="95" y1="-138" x2="68" y2="-112" />
      <!-- Lower Diagonals -->
      <line x1="-125" y1="-95" x2="-92" y2="-82" />
      <line x1="125" y1="-95" x2="92" y2="-82" />
      <!-- Bottom Side Rays -->
      <line x1="-135" y1="-45" x2="-102" y2="-45" />
      <line x1="135" y1="-45" x2="102" y2="-45" />
    </g>

    <!-- 2. SUSPENSION BRIDGE SILHOUETTE (Navy #0A2540) -->
    <g fill="#0A2540" stroke="#0A2540">
      <!-- Left Tower -->
      <g transform="translate(-150, 0)">
        <!-- Outer spire -->
        <polygon points="-28,30 -20,-75 -15,-75 -15,30" />
        <!-- Inner spire -->
        <polygon points="15,30 15,-75 20,-75 28,30" />
        <!-- Cross Struts -->
        <rect x="-16" y="-62" width="32" height="6" />
        <rect x="-18" y="-35" width="36" height="7" />
        <rect x="-22" y="-5" width="44" height="8" />
        <!-- Tower Arch portal -->
        <path d="M-15,30 L-15,0 Q0,-15 15,0 L15,30 Z" fill="#FFFFFF" />
      </g>

      <!-- Right Tower -->
      <g transform="translate(150, 0)">
        <!-- Inner spire -->
        <polygon points="-28,30 -20,-75 -15,-75 -15,30" />
        <!-- Outer spire -->
        <polygon points="15,30 15,-75 20,-75 28,30" />
        <!-- Cross Struts -->
        <rect x="-16" y="-62" width="32" height="6" />
        <rect x="-18" y="-35" width="36" height="7" />
        <rect x="-22" y="-5" width="44" height="8" />
        <!-- Tower Arch portal -->
        <path d="M-15,30 L-15,0 Q0,-15 15,0 L15,30 Z" fill="#FFFFFF" />
      </g>

      <!-- Suspension Cables (Catenary Curves) -->
      <!-- Left Backstay -->
      <path d="M-230,22 Q-190,0 -168,-72" fill="none" stroke="#0A2540" stroke-width="4.5" />
      <!-- Main Center Span Curve -->
      <path d="M-132,-72 Q0,2 132,-72" fill="none" stroke="#0A2540" stroke-width="4.5" />
      <!-- Right Backstay -->
      <path d="M168,-72 Q190,0 230,22" fill="none" stroke="#0A2540" stroke-width="4.5" />

      <!-- Vertical Hanger Cables -->
      <!-- Left Outer -->
      <line x1="-210" y1="18" x2="-210" y2="10" stroke-width="2.5" />
      <line x1="-190" y1="18" x2="-190" y2="-5" stroke-width="2.5" />
      <!-- Center Span Hangers -->
      <line x1="-105" y1="20" x2="-105" y2="-45" stroke-width="2.5" />
      <line x1="-80" y1="20" x2="-80" y2="-28" stroke-width="2.5" />
      <line x1="-55" y1="20" x2="-55" y2="-15" stroke-width="2.5" />
      <line x1="-30" y1="20" x2="-30" y2="-5" stroke-width="2.5" />
      <line x1="30" y1="20" x2="30" y2="-5" stroke-width="2.5" />
      <line x1="55" y1="20" x2="55" y2="-15" stroke-width="2.5" />
      <line x1="80" y1="20" x2="80" y2="-28" stroke-width="2.5" />
      <line x1="105" y1="20" x2="105" y2="-45" stroke-width="2.5" />
      <!-- Right Outer -->
      <line x1="190" y1="18" x2="190" y2="-5" stroke-width="2.5" />
      <line x1="210" y1="18" x2="210" y2="10" stroke-width="2.5" />

      <!-- Bridge Deck Beam -->
      <rect x="-235" y="18" width="470" height="9" rx="2" fill="#0A2540" stroke="none" />
      <!-- Deck Pier Supports -->
      <rect x="-200" y="27" width="10" height="25" fill="#0A2540" stroke="none" />
      <rect x="190" y="27" width="10" height="25" fill="#0A2540" stroke="none" />
    </g>

    <!-- 3. OPEN BOOK OF KNOWLEDGE (Bottom Base) -->
    <g transform="translate(0, 52)">
      <!-- Navy Outer Book Cover Foundation -->
      <path d="M-195,24 Q-95,-22 0,22 Q95,-22 195,24 L180,36 Q90,-8 0,33 Q-90,-8 -180,36 Z" 
            fill="#0A2540" />

      <!-- Open Book Pages (Vibrant Royal Blue & Cerulean) -->
      <!-- Lower Thick Blue Pages Base -->
      <path d="M-190,14 Q-95,-25 0,16 Q95,-25 190,14 L178,25 Q90,-12 0,24 Q-90,-12 -178,25 Z" 
            fill="#0284c7" />

      <!-- Main Open White-Highlighted Pages -->
      <path d="M-180,4 Q-90,-32 0,8 Q90,-32 180,4 L170,16 Q90,-18 0,18 Q-90,-18 -170,16 Z" 
            fill="#0369a1" />

      <!-- Distinctive Inner Symmetrical Pages (Light Blue Fanned Grooves) -->
      <path d="M-155,-5 Q-80,-35 0,0 Q80,-35 155,-5 L145,5 Q75,-24 0,7 Q-75,-24 -145,5 Z" 
            fill="#38bdf8" />
      
      <!-- Crisp White Page Spreads -->
      <path d="M-160,-10 Q-80,-40 -5,-7 L-5,-3 Q-80,-34 -155,-5 Z" fill="#FFFFFF" opacity="0.9" />
      <path d="M160,-10 Q80,-40 5,-7 L5,-3 Q80,-34 155,-5 Z" fill="#FFFFFF" opacity="0.9" />

      <!-- Center Spine Crease -->
      <path d="M0,-8 L0,32" stroke="#0A2540" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 4. DYNAMIC PATHWAYS OF SUCCESS (Rising Orange Ribbon Highway) -->
    <g fill="#F25C05" filter="url(#ysGlow)">
      <!-- Left Sweeping Road -->
      <path d="M-8,50 C-40,30 -75,-15 -12,-100 C-10,-102 -5,-102 -4,-98 C-35,-25 -25,25 -2,50 Z" />
      <!-- Right Sweeping Road -->
      <path d="M8,50 C40,30 75,-15 12,-100 C10,-102 5,-102 4,-98 C35,-25 25,25 2,50 Z" />
    </g>

    <!-- 5. GRADUATION CAP (MORTARBOARD) (Navy Blue with Orange Tassel) -->
    <g transform="translate(0, -118)">
      <!-- Diamond Mortarboard Top in 3D Perspective -->
      <polygon points="0,-38 88,-5 0,28 -88,-5" fill="#0A2540" stroke="#071a2e" stroke-width="2" />
      
      <!-- Cap Base / Skull Cap -->
      <path d="M-44,11 C-44,28 0,38 44,11 L44,22 C44,39 0,50 -44,22 Z" fill="#071a2e" />

      <!-- Top Center Button -->
      <ellipse cx="0" cy="-6" rx="4" ry="2.5" fill="#071a2e" />

      <!-- Orange Tassel Hanging on the Right -->
      <path d="M0,-6 Q32,-4 52,12 Q53,24 53,42" fill="none" stroke="#F25C05" stroke-width="4.5" stroke-linecap="round" />
      <!-- Tassel Ring / Knot -->
      <circle cx="53" cy="22" r="4.5" fill="#F25C05" />
      <!-- Tassel Fringe Brush -->
      <path d="M48,26 L58,26 L60,54 L46,54 Z" fill="#F25C05" />
      <line x1="50" y1="54" x2="50" y2="58" stroke="#F25C05" stroke-width="2" />
      <line x1="53" y1="54" x2="53" y2="59" stroke="#F25C05" stroke-width="2" />
      <line x1="56" y1="54" x2="56" y2="58" stroke="#F25C05" stroke-width="2" />
    </g>
  </g>

  <!-- 6. OFFICIAL BRAND TYPOGRAPHY: Yuva Setu -->
  <g transform="translate(300, 465)" text-anchor="middle">
    <text font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Plus Jakarta Sans', sans-serif" 
          font-weight="900" font-size="64" letter-spacing="-1">
      <tspan x="-76" fill="#0A2540">Yuva</tspan>
      <tspan x="82" fill="#F25C05">Setu</tspan>
    </text>
  </g>

  <!-- 7. OFFICIAL TAGLINE: — Samajh Se Safalta Tak — -->
  <g transform="translate(300, 515)" text-anchor="middle">
    <!-- Left Orange Accent Line -->
    <line x1="-215" y1="-7" x2="-140" y2="-7" stroke="#F25C05" stroke-width="4" stroke-linecap="round" />

    <!-- Tagline Text -->
    <text x="0" y="0"
          fill="#0A2540" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" 
          font-size="21" 
          font-weight="800" 
          letter-spacing="1">
      Samajh Se Safalta Tak
    </text>

    <!-- Right Orange Accent Line -->
    <line x1="140" y1="-7" x2="215" y2="-7" stroke="#F25C05" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
